# AI-agent process signature (koru-detect). Schema: schemas/agent-signature.v1.json.
# Matching rests on the exe path and the command line; both are attacker-controlled (KT-02).
# The signature feeds the actor-kind estimate; decoy access yields a finding regardless of the signature.
schema = 1
id = "crewai"
name = "CrewAI"
kind = "agent_framework"
references = [
    "https://github.com/crewAIInc/crewAI",
    "https://docs.crewai.com/en/installation",
]
description = "A multi-agent Python framework; the CLI is installed with uv tool install crewai, and agents run with crewai run."
validation_date = "2026-10-10"

# A process started under the name crewai
[[condition]]
argv0_name = ["crewai"]

# The crewai script running under Python
[[condition]]
exe_name = ["python", "python3", "python3.*", "pypy3"]
script_name = ["crewai"]
