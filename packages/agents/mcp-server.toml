# AI-agent process signature (koru-detect). Schema: schemas/agent-signature.v1.json.
# Matching rests on the exe path and the command line; both are attacker-controlled (KT-02).
# The signature feeds the actor-kind estimate; decoy access yields a finding regardless of the signature.
schema = 1
id = "mcp-server"
name = "MCP server"
kind = "mcp_server"
references = [
    "https://modelcontextprotocol.io/specification/2025-06-18/basic/transports",
    "https://github.com/modelcontextprotocol/servers",
    "https://github.com/github/github-mcp-server",
]
description = "Model Context Protocol servers: @modelcontextprotocol/server-* packages started with npx, mcp-server-* tools started with uvx or Python, and local binaries such as github-mcp-server. In the stdio transport the client starts the server as a child process; the server appears in the client's (e.g. a coding assistant's) lineage."
validation_date = "2026-10-10"

# Official server packages (npx -y @modelcontextprotocol/server-...)
[[condition]]
argument_contains = ["@modelcontextprotocol/"]

# mcp-server-* tools started with Node.js, Python, or uv
[[condition]]
exe_name = ["node", "nodejs", "bun", "deno", "python", "python3", "python3.*", "pypy3", "uv", "uvx"]
argument_contains = ["mcp-server-", "mcp_server_", "-mcp-server", "_mcp_server"]

# Local MCP server binaries
[[condition]]
exe_name = ["mcp-server-*", "mcp_server_*", "*-mcp-server", "*_mcp_server"]

# python -m mcp_server_...
[[condition]]
python_module = ["mcp_server_*"]
