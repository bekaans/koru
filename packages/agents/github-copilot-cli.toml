# AI-agent process signature (koru-detect). Schema: schemas/agent-signature.v1.json.
# Matching rests on the exe path and the command line; both are attacker-controlled (KT-02).
# The signature feeds the actor-kind estimate; decoy access yields a finding regardless of the signature.
schema = 1
id = "github-copilot-cli"
name = "GitHub Copilot CLI"
kind = "coding_assistant"
references = [
    "https://github.com/github/copilot-cli",
]
description = "GitHub's terminal coding agent; the npm package @github/copilot installs the copilot command."
validation_date = "2026-10-10"

# A process started under the name copilot
[[condition]]
argv0_name = ["copilot"]

# The copilot script running under Node.js
[[condition]]
exe_name = ["node", "nodejs", "bun", "deno"]
script_name = ["copilot"]

# npm package path
[[condition]]
argument_contains = ["@github/copilot"]
