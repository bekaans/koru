# AI-agent process signature (koru-detect). Schema: schemas/agent-signature.v1.json.
# Matching rests on the exe path and the command line; both are attacker-controlled (KT-02).
# The signature feeds the actor-kind estimate; decoy access yields a finding regardless of the signature.
schema = 1
id = "aider"
name = "Aider"
kind = "coding_assistant"
references = [
    "https://aider.chat/docs/install.html",
    "https://github.com/Aider-AI/aider",
]
description = "A terminal-based, Python pair-programming tool (package: aider-chat; command: aider; module: python -m aider)."
validation_date = "2026-10-10"

# A process started under the name aider
[[condition]]
argv0_name = ["aider"]

# The aider script running under Python
[[condition]]
exe_name = ["python", "python3", "python3.*", "pypy3"]
script_name = ["aider"]

# python -m aider
[[condition]]
python_module = ["aider"]
