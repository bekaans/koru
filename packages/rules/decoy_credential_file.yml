title: 'Read of a decoy credential file'
id: e32f6968-11d1-45a8-94b2-873984fde3ff
name: decoy_credential_file
status: experimental
description: 'Read of a credential file (.env, cloud credential file, LLM API keys, MCP configuration) that is a Koru decoy. Decoys are never used by any legitimate workload; a read shows that credentials are being sought on the server. If the process or one of its ancestors matches an AI agent signature, the finding is escalated to the "hijacked agent suspected" class.'
references:
    - 'https://attack.mitre.org/techniques/T1552/001/'
author: 'Koru'
date: 2026-10-10
modified: 2026-10-16
tags:
    - attack.credential-access
    - attack.t1552.001
logsource:
    product: linux
    category: file_access
detection:
    decoy:
        koru.decoy_class:
            - 'env'
            - 'cloud_credentials'
            - 'llm_keys'
            - 'mcp_config'
        koru.breadcrumb: false
        koru.read: true
    condition: decoy
falsepositives:
    - 'Broad backup or search jobs that also read decoys (e.g. grep -r); they can be added to the allowlist only by exe path and inode.'
level: high
koru:
    threat_class: decoy_access
