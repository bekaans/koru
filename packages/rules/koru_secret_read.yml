title: 'Read of the Koru secrets file'
id: 3bcf3ac9-5f93-43ff-b084-5bee10fcab56
name: koru_secret_read
status: experimental
description: 'Read, by a process other than Koru, of the .env file where notification channel and heartbeat secrets are kept. An attacker who obtains the heartbeat address can send fake health signals (KT-03, KT-21).'
references:
    - 'https://attack.mitre.org/techniques/T1552/001/'
author: 'Koru'
date: 2026-10-10
tags:
    - attack.credential-access
    - attack.t1552.001
logsource:
    product: linux
    category: file_access
detection:
    secret:
        koru.protected_kind: 'secret'
        koru.modified: false
    condition: secret
falsepositives:
    - 'The administrator inspecting the configuration by hand.'
level: high
koru:
    threat_class: self_protection
