# Decoy: AI era — project-level MCP configuration (`.mcp.json`, Claude Code format).
#
# KT-17: MCP decoys define only remote (HTTP) servers; the `command`, `args`, and `env` fields
# are forbidden (a legitimate AI agent loading this file runs no command). The addresses sit
# in a documentation network; the connection goes nowhere. Tokens are randomly generated.
schema = 1
id = "mcp-project"
description = ".mcp.json of the support-assistant project: two internal MCP servers with admin-scoped fake tokens."
kind = "decoy"
class = "mcp_config"
format = "mcp_json"
secret = true
content = """
{
  "mcpServers": {
    "billing-db": {
      "type": "http",
      "url": "http://{{ssh-config:db_ip}}:8931/mcp",
      "headers": {
        "Authorization": "Bearer {{db_jetonu}}"
      }
    },
    "internal-admin": {
      "type": "http",
      "url": "http://{{yonetim_ip}}:8080/mcp",
      "headers": {
        "Authorization": "Bearer {{yonetim_jetonu}}",
        "X-Admin-Scope": "full"
      }
    }
  }
}
"""

[target]
path = "apps/{{llm-api-keys:assistant}}/.mcp.json"
mode = 0o600
placement = "new_file"

[timestamp]
min_days = 5
max_days = 150

[values.db_jetonu]
kind = "random"
alphabet = "base64url"
length = 43

[values.yonetim_ip]
kind = "test_net_ipv4"

[values.yonetim_jetonu]
kind = "random"
alphabet = "base62"
length = 48
prefix = "mcp_"
