# Decoy: cloud credential file (`~/.aws/credentials`, INI).
#
# Two profiles: [default] and an admin profile chosen from a list. Access key ids are
# AKIA + 16 base32 characters, secret keys 40 characters; none is an existing key.
schema = 1
id = "aws-credentials"
description = "AWS CLI credential file: default and admin profiles, fake access keys in the real format."
kind = "decoy"
class = "cloud_credentials"
format = "ini"
secret = true
content = """
[default]
aws_access_key_id = {{default_access_key_id}}
aws_secret_access_key = {{default_secret_access_key}}

[{{profile}}]
aws_access_key_id = {{admin_access_key_id}}
aws_secret_access_key = {{admin_secret_access_key}}
"""

[target]
path = ".aws/credentials"
mode = 0o600
placement = "new_file"

[timestamp]
min_days = 30
max_days = 420

[values.profile]
kind = "choice"
options = ["prod-admin", "admin", "production", "billing-prod", "infra-admin"]

[values.default_access_key_id]
kind = "random"
alphabet = "base32"
length = 16
prefix = "AKIA"

[values.default_secret_access_key]
kind = "random"
alphabet = "base64"
length = 40

[values.admin_access_key_id]
kind = "random"
alphabet = "base32"
length = 16
prefix = "AKIA"

[values.admin_secret_access_key]
kind = "random"
alphabet = "base64"
length = 40
