name: Feature request
description: Suggest a decoy, rule, signature or product improvement
title: "[feat] "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What attack, decoy or workflow is not covered today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: For decoys/rules, name the files under packages/ you expect to touch.
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [decoy template, detection rule, agent signature, Rust code, documentation, other]
