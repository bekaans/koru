# Pull request checks: the PR title and every commit follow CONTRIBUTING.md.
# Both jobs run .githooks/commit-msg, the same script contributors run locally.
name: PR checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the PR title as a commit subject
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          title=$PR_TITLE
          # Dependabot always writes "Bump"; the dependabot-title job lowercases it on the PR.
          if [ "$PR_AUTHOR" = 'dependabot[bot]' ]; then
            title=$(printf '%s' "$title" | sed -E 's/^([a-z]+(\([a-z,-]+\))?!?: )Bump /\1bump /')
          fi
          msg=$(mktemp)
          # The title is the squash commit subject; the maintainer signs the squash commit.
          printf '%s\n\nSigned-off-by: CI <ci@example.com>\n' "$title" > "$msg"
          .githooks/commit-msg "$msg"

  dependabot-title:
    name: lowercase the dependabot title
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Rewrite "Bump" to "bump" so the squash subject passes commit-msg
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title=$(printf '%s' "$PR_TITLE" | sed -E 's/^([a-z]+(\([a-z,-]+\))?!?: )Bump /\1bump /')
          if [ "$title" != "$PR_TITLE" ]; then
            gh pr edit "$PR_URL" --title "$title"
          fi

  commits:
    name: commit messages and sign-offs
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate every commit message in base..head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          msg=$(mktemp)
          for sha in $(git rev-list --no-merges --reverse "${BASE_SHA}..${HEAD_SHA}"); do
            git log -1 --format=%B "$sha" > "$msg"
            if ! .githooks/commit-msg "$msg"; then
              echo "::error::commit ${sha} violates the commit message rules"
              status=1
            fi
          done
          exit "$status"
