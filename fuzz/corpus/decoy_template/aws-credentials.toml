# Decoy: cloud credential file (`~/.aws/credentials`, INI).
#
# Two profiles: [default] and an admin profile chosen from a list. Access key ids are
# AKIA + 16 base32 characters, secret keys 40 characters; none is an existing key.
schema = 1
id = "aws-credentials"
description = "AWS CLI credential file: default and admin profiles, fake access keys in the real format."
kind = "decoy"
class = "cloud_credentials"
format = "ini"
secret = true
content = """
[default]
aws_access_key_id = {{varsayilan_kimlik}}
aws_secret_access_key = {{varsayilan_gizli}}

[{{profil}}]
aws_access_key_id = {{yonetici_kimlik}}
aws_secret_access_key = {{yonetici_gizli}}
"""

[target]
path = ".aws/credentials"
mode = 0o600
placement = "new_file"

[timestamp]
min_days = 30
max_days = 420

[values.profil]
kind = "choice"
options = ["prod-admin", "admin", "production", "billing-prod", "infra-admin"]

[values.varsayilan_kimlik]
kind = "random"
alphabet = "base32"
length = 16
prefix = "AKIA"

[values.varsayilan_gizli]
kind = "random"
alphabet = "base64"
length = 40

[values.yonetici_kimlik]
kind = "random"
alphabet = "base32"
length = 16
prefix = "AKIA"

[values.yonetici_gizli]
kind = "random"
alphabet = "base64"
length = 40
